<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vrpg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- start screen: player describes their character and the story context -->
  <div id="start-screen">
    <h1>vrpg</h1>
    <p>Describe the character you'll play.</p>
    <textarea id="character" rows="2" maxlength="500" placeholder="e.g. a wiry young woman with a scar over one eye, worn leather armor, red cloak"></textarea>
    <p>Describe the starting point of your story.</p>
    <textarea id="context" rows="4" maxlength="2000" placeholder="e.g. waking up in a medieval tavern with no memory, a hooded figure sitting across the table..."></textarea>
    <button id="begin">Begin</button>

    <!-- past stories: resume, render to video, or delete saved runs -->
    <div id="stories-section" hidden>
      <p>Past stories</p>
      <div id="stories"></div>
    </div>
  </div>

  <!-- game screen: video stage plus choice buttons -->
  <div id="game-screen" hidden>
    <div id="stage">
      <img id="frame" hidden alt="current frame">
      <!-- two players: clips preload into the hidden one, then swap on stage with no load gap -->
      <video id="player" hidden playsinline preload="auto"></video>
      <video id="player-b" hidden playsinline preload="auto"></video>
    </div>
    <div id="status" hidden></div>
    <!-- timeline toggle, top left -->
    <button id="timeline-toggle">Timeline</button>
    <div id="choices"></div>
    <!-- dev panel: shows the llm-generated prompts behind the current turn -->
    <details id="dev">
      <summary>Dev: prompts</summary>
      <pre id="dev-body"></pre>
    </details>
    <!-- timeline sidebar: every turn of the story, rewind and prune; cost + restart live at its bottom -->
    <div id="sidebar" hidden>
      <div id="sidebar-head">
        <span>Timeline</span>
        <button id="sidebar-close" aria-label="close timeline">&times;</button>
      </div>
      <div id="timeline"></div>
      <div id="sidebar-bottom">
        <!-- cost tracker: the active story's api spend -->
        <div id="cost" hidden>
          <span>llm</span><span class="amt" id="cost-llm"></span>
          <span>fal</span><span class="amt" id="cost-fal"></span>
          <span>total</span><span class="amt" id="cost-total"></span>
        </div>
        <button id="restart">Restart</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
